[package]
name = "wirefold-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "wirefold against serde_json, bincode, postcard, rmp-serde and rkyv on the same records. Kept out of the library workspace so wirefold itself stays dependency-free."

# Its own workspace root, so cargo does not treat it as part of the library workspace.
[workspace]

[dependencies]
wirefold = { path = "..", features = ["derive", "syntax", "compress"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: without it serde_json can be 1 ulp off when parsing random f64s, which would
# fail this crate's exactness check. It is the setting you need for exact floats, so it is used.
serde_json = { version = "1", features = ["float_roundtrip"] }
bincode = "1.3"
postcard = { version = "1", features = ["use-std"] }
rmp-serde = "1"
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "alloc"] }
zstd = "0.13"
# the other compressors the report compares against (benchmark only; the library depends on none of them)
lz4 = "1"
snap = "1"
flate2 = "1"
brotli = "7"
ryu = "1"
itoa = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
