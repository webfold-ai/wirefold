name: Tag the release main declares

# A merge becomes a release with no human and no private dependency: read the version the default branch
# declares, and if nothing on the remote carries it, tag that commit. `release.yml` (tag-triggered, where
# a repository has one) then packages and signs it.
#
# This is the tag half of the release, not the bump half. Bumping the version is a pull request, which is
# where the version is decided and reviewed; this makes the tag appear so that dependents have a semver to
# pin instead of `rev = "<sha>"`, and so `caretaker-pins --prefer-tags` has a tag to move to.
#
# It deliberately does not fetch `caretakers-bump`: that tool lives in a private repository, and a public
# repository's runner cannot install it (measured: `cargo install --git .../caretaker` fails on every push
# to main, and no RELEASE_TOKEN secret exists in any of these repositories). The scheduled fleet job runs
# the same step from the box, where the token and the tool both exist; this is the version that works with
# nothing but the repository itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  tag:
    name: tag the declared version
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Tag the version the manifest declares, once
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # `[package] version = "..."`, or `[workspace.package]` when the package inherits it.
          version="$(awk '
            /^[[:space:]]*\[/ { s = $0; gsub(/[][[:space:]]/, "", s); next }
            s == "package" && $0 ~ /^version[[:space:]]*=[[:space:]]*"/ {
              v = $0; sub(/^[^"]*"/, "", v); sub(/"[[:space:]]*$/, "", v); print v; exit
            }' Cargo.toml)"
          if [ -z "$version" ]; then
            version="$(awk '
              /^[[:space:]]*\[/ { s = $0; gsub(/[][[:space:]]/, "", s); next }
              s == "workspace.package" && $0 ~ /^version[[:space:]]*=[[:space:]]*"/ {
                v = $0; sub(/^[^"]*"/, "", v); sub(/"[[:space:]]*$/, "", v); print v; exit
              }' Cargo.toml)"
          fi
          if [ -z "$version" ]; then
            echo "no [package] version and no [workspace.package] version in Cargo.toml" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already on the remote: nothing to release"
            exit 0
          fi
          git config user.name "caretakers-bump"
          git config user.email "caretakers-bump@twn.systems"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"
          echo "tagged $(git rev-parse --short HEAD) as $tag"
          # A tag pushed with GITHUB_TOKEN does not start a workflow; start the packaging job explicitly.
          if gh workflow view release.yml >/dev/null 2>&1; then
            gh workflow run release.yml --ref "$tag"
          else
            echo "this repository has no release.yml: the tag is the release"
          fi
