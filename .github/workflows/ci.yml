name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-features
      - name: Run the documented examples
        run: cargo run --locked --example usage --all-features
      - name: Build with no default features
        run: cargo check --locked --no-default-features

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Check
        run: cargo +1.89.0 check --locked --all-features

  docs:
    name: Rustdoc (no warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build the docs, failing on any warning
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  semver:
    name: Semver check against the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Find the baseline
        id: base
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -z "${TAG}" ]; then echo "::notice::no release tag yet; nothing to compare against"; fi
      - name: Install cargo-semver-checks
        if: steps.base.outputs.tag != ''
        run: cargo install cargo-semver-checks --locked
      - name: Check the public API against the baseline
        if: steps.base.outputs.tag != ''
        env:
          BASELINE: ${{ steps.base.outputs.tag }}
        run: cargo semver-checks check-release --package wirefold --all-features --baseline-rev "${BASELINE}"

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src
      # AddressSanitizer runs with its leak check on for every test.
      - name: Tests under the sanitizer
        run: >
          cargo +nightly test --locked --all-features --tests
          --target x86_64-unknown-linux-gnu -Zbuild-std
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
