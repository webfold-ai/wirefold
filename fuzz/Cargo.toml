[package]
name = "wirefold-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wirefold = { path = "..", features = ["syntax"] }

# The fuzz crate is its own workspace root so cargo does not walk up into the library workspace.
[workspace]
members = ["."]

[[bin]]
name = "fuzz_decompress"
path = "fuzz_targets/fuzz_decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_msgpack"
path = "fuzz_targets/fuzz_msgpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_syntax"
path = "fuzz_targets/fuzz_syntax.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_term"
path = "fuzz_targets/fuzz_term.rs"
test = false
doc = false
bench = false
