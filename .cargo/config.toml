# The CPU ISA floor, per target — the CPU analog of the GPU restricting itself to DP4A.
# x86-64-v3 = AVX2+FMA+BMI2, the common microarchitecture level (any x86 since ~2013; what
# llama.cpp's default build assumes). NOT -C target-cpu=native: v3 binaries run on any v3+
# machine. aarch64 needs nothing — NEON is in its baseline.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]
