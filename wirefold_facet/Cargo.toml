[package]
name = "wirefold_facet"
version = "0.1.0"
edition = "2021"
description = "Facet reflection for wirefold: any Facet type to and from the universal Term, plus a language-neutral schema and Python, TypeScript, Go and JSON Schema emitters."
license = "Apache-2.0"
repository = "https://github.com/webfold-ai/wirefold"
rust-version = "1.90"
keywords = ["facet", "reflection", "codegen", "bindings", "wirefold"]
categories = ["encoding", "development-tools"]

[dependencies]
wirefold = { version = "0.1.0", path = "..", default-features = false, features = ["syntax"] }
facet = "0.46"
facet-value = "0.46"
