[workspace]
resolver = "2"
members = ["wirefold_derive", "wirefold_facet", "wirefold_bindings"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[profile.release]
debug = true

[package]
name = "wirefold"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Zero-copy wire format, a universal Term, an integer column codec, a context-mixing coder and structured-text surfaces (JSON, YAML, TOON, POML, RDF), with #[derive(Collapse, Term, Validate, Error)]. Built on apeiron."
keywords = ["serialization", "codec", "zero-copy", "compression", "json"]
categories = ["encoding", "compression"]
readme = "README.md"
repository = "https://github.com/webfold-ai/wirefold"
rust-version = "1.89"
exclude = [".github/", "deny.toml"]

[dependencies]
apeiron = { version = "0.1.0", git = "https://github.com/webfold-ai/apeiron", rev = "1c3d4a1da565cde409f6f3cb343086aa6853eb9c" }
wirefold_derive = { version = "0.1.0", path = "wirefold_derive", optional = true }
serde = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(procmasq_no_export)'] }

[features]
default = ["codec"]
# Zero-copy wire format + universal Term + integer column codec
codec = ["compress"]
# Context-mixing entropy coder
compress = []
# Collapsed syntax AST (JSON/YAML/TOON/POML/RDF surfaces)
syntax = ["codec"]
# #[derive(Collapse)] and #[derive(Term)] for columnar zero-copy serialization
derive = ["codec", "dep:wirefold_derive"]
# anyhow/thiserror-style Error, Result and Context, plus #[derive(Error)]
error = ["dep:wirefold_derive"]
# validator-style Validate trait plus #[derive(Validate)]
validate = ["dep:wirefold_derive"]
# Bridge for serde types: any Serialize/Deserialize type to and from the universal Term, and so to
# every surface (JSON, YAML, TOON, POML, RDF) and MessagePack
serde = ["syntax", "dep:serde"]

[[test]]
name = "collapse_derive"
required-features = ["derive"]

[[test]]
name = "term_derive"
required-features = ["derive"]

[[test]]
name = "validate_derive"
required-features = ["validate", "derive"]

[[test]]
name = "error_masquerade"
required-features = ["error"]

[[test]]
name = "codec_hostile_input"
required-features = ["codec"]

[[test]]
name = "json_strict"
required-features = ["syntax"]

[[test]]
name = "parser_dos"
required-features = ["syntax"]

[[test]]
name = "parse_behaviour"
required-features = ["syntax"]

[[test]]
name = "serde_bridge"
required-features = ["serde"]
